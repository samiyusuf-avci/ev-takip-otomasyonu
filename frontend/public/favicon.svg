<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140726" />
      <stop offset="50%" stop-color="#0c0517" />
      <stop offset="100%" stop-color="#07030d" />
    </linearGradient>

    <!-- Neon Purple Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Neon Light Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambient" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="140" fill="#a855f7" opacity="0.22" filter="url(#ambient)" />

  <g filter="url(#neonGlow)" fill="none" stroke="url(#neonGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chimney on Right Roof -->
    <path d="M 334 158 L 334 116 A 8 8 0 0 1 342 108 L 364 108 A 8 8 0 0 1 372 116 L 372 190" stroke-width="18" />

    <!-- Symmetric Neon House Frame -->
    <path d="M 140 235 L 140 370 A 24 24 0 0 0 164 394 L 348 394 A 24 24 0 0 0 372 370 L 372 235 L 398 235 A 10 10 0 0 0 404 218 L 263 98 A 12 12 0 0 0 249 98 L 108 218 A 10 10 0 0 0 114 235 Z" stroke-width="20" />

    <!-- Inner Sync Arrows -->
    <!-- Top Arc Arrow -->
    <path d="M 205 255 A 58 58 0 0 1 310 240" stroke-width="16" />
    <path d="M 215 230 L 205 255 L 232 262" stroke-width="16" />

    <!-- Bottom Arc Arrow -->
    <path d="M 307 305 A 58 58 0 0 1 202 320" stroke-width="16" />
    <path d="M 297 330 L 307 305 L 280 298" stroke-width="16" />
  </g>
</svg>